apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: platform
spec:
  replicas: 2
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      terminationGracePeriodSeconds: 70
      containers:
      - name: api
        image: platform-api:dev
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 8080}]
        envFrom: [{configMapRef: {name: platform-config}}]
        env:
        - {name: PGUSER, value: platform}
        - {name: PGPASSWORD, value: local-only-change-me}
        readinessProbe:
          httpGet: {path: /readyz, port: 8080}
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet: {path: /healthz, port: 8080}
          initialDelaySeconds: 10
          periodSeconds: 10
        startupProbe:
          httpGet: {path: /healthz, port: 8080}
          failureThreshold: 30
          periodSeconds: 2
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: "1", memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: platform
spec:
  selector: {app: api}
  ports: [{name: http, port: 8080, targetPort: 8080}]
