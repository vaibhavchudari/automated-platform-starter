apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: platform
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app: worker}
  template:
    metadata:
      labels: {app: worker}
    spec:
      terminationGracePeriodSeconds: 70
      containers:
      - name: worker
        image: 323708468873.dkr.ecr.ap-south-1.amazonaws.com/automated-platform-worker:3
        imagePullPolicy: IfNotPresent
        envFrom: [{configMapRef: {name: platform-config}}]
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: "1", memory: 512Mi}